name: RepoBrain Autonomous CI Self-Healing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Test Suite
        id: test_step
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_*.py" > test_run.log 2>&1
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Run RepoBrain Autonomous Self-Healing
        if: env.TEST_EXIT_CODE != '0'
        run: |
          python -m repobrain.cli heal --test tests/test_ast_chunker.py --output pr_healing_report.md
          echo "HEAL_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Post PR Review Comment
        if: env.TEST_EXIT_CODE != '0' && hashFiles('pr_healing_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_healing_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
