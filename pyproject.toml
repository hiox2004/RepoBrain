[project]
name = "repobrain"
version = "2.0.0"
description = "Autonomous Codebase Memory, Self-Healing Bug Cache & Execution Harness"
readme = "00_FOUNDING_ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "fastmcp>=0.4.1",
    "tree-sitter>=0.21.3",
    "tree-sitter-languages>=1.10.2",
    "sentence-transformers>=3.0.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9.0",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

